<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traccia 1: Analizzatore di Recensioni AI</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f9f9f9; padding: 20px; color: #333; }
        .container { max-width: 700px; margin: 30px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        textarea { width: 100%; height: 120px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 15px; }
        .btn-group { display: flex; gap: 10px; margin: 15px 0; }
        button { flex: 1; padding: 12px; font-size: 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        #btnAnalizza { background-color: #3498db; color: white; }
        #btnPredefinite { background-color: #9b59b6; color: white; }
        button:disabled { background-color: #bdc3c7 !important; cursor: not-allowed; }
        #status { text-align: center; font-style: italic; color: #7f8c8d; margin-bottom: 15px; background: #eee; padding: 8px; border-radius: 4px; }
        #result { padding: 15px; background-color: #f8f9fa; border-radius: 4px; margin-top: 15px; display: none; }
        #containerTabella { margin-top: 30px; display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Traccia 1: Analizzatore di Recensioni AI</h1>
        
        <div id="status">Connessione ai server dell'IA...</div>

        <label for="inputText">Scrivi qui la tua recensione:</label>
        <textarea id="inputText" placeholder="Scrivi una frase in italiano... (Es: Questo programma è fantastico!)"></textarea>

        <div class="btn-group">
            <button id="btnAnalizza" disabled>Analizza</button>
            <button id="btnPredefinite" disabled>Test 3 Recensioni (Extra)</button>
        </div>

        <div id="result"></div>

        <div id="containerTabella">
            <h3>Analisi Recensioni Predefinite</h3>
            <table>
                <thead>
                    <tr>
                        <th>Testo Recensione</th>
                        <th>Etichetta original</th>
                        <th>Confidenza</th>
                        <th>Esito</th>
                    </tr>
                </thead>
                <tbody id="corpoTabella"></tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { pipeline } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2';

        const inputText = document.getElementById("inputText");
        const btnAnalizza = document.getElementById("btnAnalizza");
        const statusDiv = document.getElementById("status");
        const resultDiv = document.getElementById("result");
        const btnPredefinite = document.getElementById("btnPredefinite");
        const containerTabella = document.getElementById("containerTabella");
        const corpoTabella = document.getElementById("corpoTabella");

        let classifier;

        async function caricaModello() {
            try {
                statusDiv.innerText = "Download del modello AI avviato... Attendi il 100%...";
                
                // Carichiamo il modello multilingua leggero ottimizzato per v3
                classifier = await pipeline("sentiment-analysis", "Xenova/distilbert-base-multilingual-cased-sentiment-2bi", {
                    progress_callback: (data) => {
                        if (data.status === 'progress') {
                            statusDiv.innerText = `Scaricamento: ${data.progress.toFixed(0)}% del file ${data.file}`;
                        } else if (data.status === 'ready') {
                            statusDiv.innerText = "Configurazione finale del modello...";
                        }
                    }
                });

                statusDiv.innerText = "Modello pronto! Inserisci un testo e clicca 'Analizza'.";
                btnAnalizza.disabled = false;
                btnPredefinite.disabled = false;
            } catch (errore) {
                statusDiv.style.background = "#fce4d6";
                statusDiv.innerHTML = "<span style='color: #c00000;'><strong>Errore di caricamento:</strong> " + errore.message + "</span>";
                console.error(errore);
            }
        }

        async function analizzaRecensione() {
            const testo = inputText.value.trim();

            if (testo === "") {
                resultDiv.style.display = "block";
                resultDiv.style.borderLeft = "5px solid #e74c3c";
                resultDiv.innerHTML = "<span style='color: #e74c3c;'><strong>Errore:</strong> La casella è vuota! Scrivi qualcosa.</span>";
                return;
            }

            statusDiv.innerText = "L'IA sta pensando...";
            btnAnalizza.disabled = true;

            try {
                const output = await classifier(testo);
                const risultato = output[0];
                const confidenza = (risultato.score * 100).toFixed(2);

                let messaggioPersonalizzato = "";
                let coloreBordo = "";

                // Gestione etichette del modello multilingua (LABEL_1 = positivo, LABEL_0 = negativo)
                if (risultato.label === "LABEL_1" || risultato.label.toLowerCase().includes("pos")) {
                    messaggioPersonalizzato = "Recensione Positiva";
                    coloreBordo = "#2ecc71"; // Verde
                } else {
                    messaggioPersonalizzato = "Recensione Negativa";
                    coloreBordo = "#e74c3c"; // Rosso
                }

                resultDiv.style.display = "block";
                resultDiv.style.borderLeft = `5px solid ${coloreBordo}`;
                resultDiv.innerHTML = `
                    <strong>Risultato del Modello (ID):</strong> ${risultato.label}<br>
                    <strong>Grado di Confidenza:</strong> ${confidenza}%<br>
                    <strong>Esito:</strong> <span style="color: ${coloreBordo}; font-weight: bold;">${messaggioPersonalizzato}</span>
                `;
                
                statusDiv.innerText = "Analisi completata.";
            } catch (errore) {
                statusDiv.innerText = "Errore durante l'analisi del testo.";
                console.error(errore);
            } finally {
                btnAnalizza.disabled = false;
            }
        }

        async function analizzaPredefinite() {
            const recensioni = [
                "Questo sito web è strutturato benissimo, mi piace molto!",
                "Che brutto servizio. Non funziona niente e va sempre in errore.",
                "Il codice è abbastanza chiaro, ma l'app si carica lentamente."
            ];

            statusDiv.innerText = "Analisi degli esempi in corso...";
            corpoTabella.innerHTML = "";
            containerTabella.style.display = "block";

            for (const testo of recensioni) {
                try {
                    const output = await classifier(testo);
                    const ris = output[0];
                    const conf = (ris.score * 100).toFixed(2);
                    let esito = ris.label === "LABEL_1" || ris.label.toLowerCase().includes("pos") ? "Positiva" : "Negativa";

                    const riga = document.createElement("tr");
                    riga.innerHTML = `
                        <td>${testo}</td>
                        <td>${ris.label}</td>
                        <td>${conf}%</td>
                        <td style="font-weight: bold; color: ${esito === 'Positiva' ? '#2ecc71' : '#e74c3c'}">${esito}</td>
                    `;
                    corpoTabella.appendChild(riga);
                } catch (e) {
                    console.error(e);
                }
            }
            statusDiv.innerText = "Tabella completata!";
        }

        // Avvio delle funzioni
        window.addEventListener('DOMContentLoaded', caricaModello);
        btnAnalizza.addEventListener("click", analizzaRecensione);
        btnPredefinite.addEventListener("click", analizzaPredefinite);
    </script>
</body>
</html>
